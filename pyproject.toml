[project]
name = "introspy"
version = "0.3.2"
description = "Explore and search Claude Code conversation logs"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    # Imported directly by api/errors.py, which registers its handler on
    # Starlette's HTTPException — the class routing and StaticFiles raise.
    # `fastapi.HTTPException` is a *subclass*, so registering on that instead
    # would silently drop every 404 that never reaches a handler.
    "starlette>=0.40",
    "pydantic>=2.0",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.0",
    # >=1.10: `TransportSecuritySettings` (DNS-rebinding protection for the
    # streamable-HTTP transport) — see introspect/mcp/server.py.
    # <2: mcp 2.0 removed `mcp.server.fastmcp` (the FastMCP server API this
    # package builds on). Lift once introspect.mcp is ported to the 2.x API.
    "mcp>=1.10,<2",
    "plotly>=5.0",
    "nolegend>=0.1.2",
    "packaging>=21.0",
]

[project.scripts]
introspect = "introspect.cli:app"
introspy = "introspect.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/introspect"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "httpx2",
    "vulture",
    "deptry",
    "poethepoet",
    "beautifulsoup4",
    "ty-find>=0.4.0",
    "biston>=0.5.0",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=4.1.0",
    # tests/test_docs_drift.py parses mkdocs.yml.
    "pyyaml>=6.0",
    "gerenuk>=0.1.0",
    "zorilla>=0.1.4",
    "madoqua>=0.2.2",
    "pycoati>=0.2.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-llmstxt>=0.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF", "S", "PERF", "FURB"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "S"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.biston.scan]
# Scanned set: first-party Python only. Tests are excluded because parallel
# test bodies are legitimately repetitive — scan those on demand with
# `biston scan --tests-only .` instead of on every commit.
include = ["src/**/*.py", "scripts/**/*.py"]
exclude = ["**/__init__.py"]
# 0.75 rather than biston's 0.7 default: the codex.py response-item/event-msg
# dispatch pair sits at 0.73 and is deliberate parallel structure, not an
# extraction opportunity. Anything genuinely duplicated scores above this.
threshold = 0.75
min_lines = 5

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # madoqua appends the staged .py files. biston reads them as --focus-args focus files
    # (only clone pairs touching a staged file); zorilla lints exactly those files.
    { name = "biston",  cmd = "biston scan --focus-args", timeout_s = 60,  max_output_lines = 80 },
    { name = "zorilla", cmd = "zorilla check",            timeout_s = 30,  max_output_lines = 80 },
    # gerenuk scopes itself from the git diff, so no file list. `-o addopts=` drops the
    # --cov from [tool.pytest.ini_options]; `-n auto` is what poe test-quick uses (full
    # suite ~55 s parallel vs ~160 s serial).
    { name = "gerenuk", cmd = "gerenuk run -- -q -o addopts= -n auto", pass_files = false, timeout_s = 300, max_output_lines = 120 },
]

[tool.zorilla.rules.ZR005]
# Every literal below is synthetic test data: TestClient routes the app serves, or
# fake filesystem paths the tests hand to path-mapping code. None is a real
# external resource.
allowed_prefixes = [
    "/sessions", "/stats", "/tools", "/mcps", "/search", "/raw", "/api/",
    "/tmp/", "/home/user/", "/usr/bin/", "/repo/", "/root/",
    "http://127.0.0.1", "https://evil.example",
]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
per_rule_ignores = {"DEP002" = ["jinja2"], "DEP003" = ["introspect"]}

[tool.poe]
verbosity = -1

[tool.poe.tasks.fix]
sequence = [
    { cmd = "ruff format --quiet ." },
    { cmd = "ruff check --fix --quiet ." },
]
help = "Auto-fix: format and lint"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Run linter (no fix)"

[tool.poe.tasks.typecheck]
cmd = "ty check"
help = "Run type checker"

[tool.poe.tasks.test]
cmd = "pytest -q --tb=short -n auto"
help = "Run tests (parallel)"

[tool.poe.tasks.test-quick]
cmd = "pytest -o addopts= -x -qq --tb=line --no-header -n auto"
help = "Fail-fast tests: no coverage, minimal output, parallel (used by `check`)"

[tool.poe.tasks.vulns]
shell = "uvx pysentry-rs --compact . || true"
interpreter = "bash"
help = "Dependency vulnerability scan"

[tool.poe.tasks.impacted-tests]
cmd = "gerenuk impacted-tests"
help = "List the tests impacted by the current diff against origin/main (gerenuk -> tyf)"

[tool.poe.tasks.test-smells]
cmd = "zorilla check tests"
help = "Test-quality lint (also in `check`; the commit hook runs it on staged files)"

[tool.poe.tasks.dead-code]
cmd = "vulture src"
help = "Dead code detection"

[tool.poe.tasks.unused-deps]
cmd = "deptry ."
help = "Unused dependency check"

[tool.poe.tasks.clones]
cmd = "biston scan ."
help = "Structural clone detection (advisory)"

[tool.poe.tasks._check-parallel]
# A bare `wait` returns only the LAST job's status, so a ruff or deptry
# failure here used to exit 0 and `check` reported success over a red tool.
# Collect the PIDs and wait on each one instead.
shell = """
  pids=()
  ruff check . &                          pids+=($!)
  ty check &                              pids+=($!)
  vulture src &                           pids+=($!)
  deptry . &                              pids+=($!)
  biston scan . &                         pids+=($!)
  zorilla check . &                       pids+=($!)
  (uvx pysentry-rs --compact . || true) & pids+=($!)
  status=0
  for pid in "${pids[@]}"; do
    wait "$pid" || status=1
  done
  exit $status
"""
interpreter = "bash"

[tool.poe.tasks.check-fast]
shell = """
  ruff check . &
  ty check &
  wait
"""
interpreter = "bash"
help = "Lint + typecheck only — sub-second feedback loop"

[tool.poe.tasks.check]
sequence = [
    { ref = "_check-parallel" },
    { ref = "test-quick" },
]
help = "Run all checks (parallel where possible)"

[tool.poe.tasks.check-all]
sequence = [
    { ref = "lint" },
    { ref = "typecheck" },
    { ref = "vulns" },
    { ref = "dead-code" },
    { ref = "unused-deps" },
    { ref = "clones" },
    { ref = "test" },
]
ignore_fail = true
help = "Run all checks (report all failures)"

[tool.poe.tasks.test-e2e]
cmd = "pytest tests/e2e -v"
help = "Run E2E tests"

[tool.poe.tasks.docs-cli]
cmd = "python scripts/gen_cli_docs.py"
help = "Regenerate docs/usage/cli-reference.md from the CLI's own --help"

[tool.poe.tasks.setup]
cmd = "madoqua install"
help = "Install the commit hook (writes hooks/pre-commit, sets core.hooksPath)"

[tool.poe.tasks.worktree]
cmd = "bash scripts/worktree.sh"
help = "Create a worktree under ~/worktrees from a fresh origin/main. Usage: poe worktree <branch> [base-ref]"

[tool.poe.tasks.release]
shell = """
  uv version --bump ${level:-patch} && \
  v=$(uv version --short) && \
  git commit -am "Release v$v" && \
  git tag "v$v" && \
  git push origin HEAD "v$v"
"""
interpreter = "bash"
help = "Bump version (level=patch|minor|major, default patch), commit, tag, push"
